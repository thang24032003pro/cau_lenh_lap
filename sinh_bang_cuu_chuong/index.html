<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng Cửu Chương</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Bảng Cửu Chương</h2>
    <div id="display"></div>

    <script>
        let sout, i, j;
        sout = "<table>";
        
        for (i = 1; i <= 9; i++) {
            sout = sout + "<tr>";
            
            for (j = 2; j <= 20; j++) {
                sout = sout + "<td>" + j + " x " + i + " = " + (i * j) + "</td>";
            }
            
            sout = sout + "</tr>";
        }
        
        sout = sout + "</table>";
        document.getElementById("display").innerHTML = sout;
    </script>
</body>
</html>
