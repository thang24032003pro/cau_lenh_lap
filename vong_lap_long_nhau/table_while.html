<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng số sử dụng vòng lặp While</title>
</head>
<body>
    <script>
        let sout, i, j;
        sout = "<table border='1' width='300' cellspacing='0' cellpadding='3'>";
        i = 1;
        while (i <= 10) {
            sout = sout + "<tr>";
            j = 1;
            while (j <= 10) {
                sout = sout + "<td>" + i * j + "</td>";
                j++;
            }
            sout = sout + "</tr>";
            i++;
        }
        sout = sout + "</table>";
        document.write(sout);
    </script>
</body>
</html>
