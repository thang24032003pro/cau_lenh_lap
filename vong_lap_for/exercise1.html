<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 1 - Vòng lặp For</title>
</head>
<body>
    <p id="result"></p>
    <script>
        let text = "";
        let i;
        for (i = 0; i <= 5; i++) {
            text += "The number is " + i + "<br>";
        }
        document.getElementById("result").innerHTML = text;
    </script>
</body>
</html>
