<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 2 - Tính tổng</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("Enter your number: "));
        let total = 0;
        let i = 1;
        for (; i <= num; i += 1) {
            total = total + i;
        }
        alert(total);
    </script>
</body>
</html>
