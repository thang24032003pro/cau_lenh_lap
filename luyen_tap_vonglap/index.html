<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập thực hành vòng lặp</title>
</head>
<body>
    <script>
        // Bài 1: In dãy Fibonacci (Ví dụ 20 số đầu tiên)
        let a = 0, b = 1, nextTerm;
        let fiboResult = "";
        for (let i = 1; i <= 20; i++) {
            fiboResult += a + " ";
            nextTerm = a + b;
            a = b;
            b = nextTerm;
        }
        console.log("Fibonacci:", fiboResult);

        // Bài 2: Tính giai thừa
        let n = parseInt(prompt("Nhập số nguyên dương để tính giai thừa:"));
        let factorial = 1;
        for (let i = 1; i <= n; i++) {
            factorial *= i;
        }
        console.log("Giai thừa:", factorial);

        // Bài 3: In tam giác vuông (Góc vuông dưới - trái)
        for (let i = 1; i <= 5; i++) {
            for (let j = 1; j <= i; j++) {
                document.write("*");
            }
            document.write("<br>");
        }
        document.write("<br>");

        // Bài 4: In hình chữ nhật
        for (let i = 1; i <= 7; i++) {
            for (let j = 1; j <= 20; j++) {
                if (i === 1 || i === 7 || j === 1 || j === 20) {
                    document.write("*");
                } else {
                    document.write("&nbsp;&nbsp;");
                }
            }
            document.write("<br>");
        }

        // Bài 5: Tính lãi ngân hàng (Lãi kép)
        let money = parseFloat(prompt("Số tiền ban đầu:"));
        let month = parseInt(prompt("Số tháng cho vay:"));
        let rate = parseFloat(prompt("Lãi suất hàng tháng (%):")) / 100;
        for (let i = 1; i <= month; i++) {
            money += money * rate;
        }
        console.log("Tổng tiền nhận được:", money.toFixed(2));

        // Bài 6: In hình trái tim
        for (let i = 1; i < 7; i++) {
            for (let j = 1; j <= 7; j++) {
                if ((i === 1 && (j === 1 || j === 4 || j === 7)) ||
                    (i === 4 && (j === 1 || j === 7)) ||
                    (i === 5 && (j <= 2 || j >= 6)) ||
                    (i === 6 && (j <= 3 || j >= 5))) {
                    document.write("&nbsp;&nbsp;");
                } else {
                    document.write("*");
                }
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
