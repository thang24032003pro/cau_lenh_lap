<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hiển thị số nguyên tố</title>
</head>
<body>
    <script>
        let numbers = parseInt(prompt("Nhập số lượng số nguyên tố cần in:"));
        let count = 0;
        let N = 2;
        let result = "";

        while (count < numbers) {
            let isPrime = true;
            for (let i = 2; i <= Math.sqrt(N); i++) {
                if (N % i === 0) {
                    isPrime = false;
                    break;
                }
            }
            if (isPrime) {
                result += N + " ";
                count++;
            }
            N++;
        }
        document.write("Dãy số nguyên tố: " + result);
    </script>
</body>
</html>
